apiVersion: v1
kind: Service
metadata:
  name: lg-thinq-extra
  namespace: monitoring
  labels:
    app: lg-thinq-extra
spec:
  type: ClusterIP
  selector:
    lg-thinq-group: extra
  ports:
    - name: metrics
      port: 9810
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lg-thinq-extra
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: lg-thinq-extra
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
