---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wcrpc-tls
  namespace: monitoring
spec:
  secretName: wcrpc-tls
  issuerRef:
    name: wcrpc-ca-issuer
    kind: ClusterIssuer
  dnsNames:
