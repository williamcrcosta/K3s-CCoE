    {
      "id": null,
      "uid": "deye-solar-cockpit-noc",
      "title": "DEYE Solar · Cockpit NOC",
      "description": "Cockpit NOC do inversor DEYE: telemetria ao vivo via deye-exporter/Prometheus (polling Modbus a cada 60s) + histórico SOLARMAN importado no PostgreSQL (janela fixa de 2 anos nos painéis históricos). Ausência de dados não significa geração zero. Consumo e rede não validados.",
      "tags": [
        "deye",
        "solar",
        "homelab",
        "cockpit",
        "noc",
        "postgresql",
        "prometheus"
      ],
      "timezone": "America/Sao_Paulo",
      "schemaVersion": 42,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "liveNow": true,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "preload": false,
      "timepicker": {},
