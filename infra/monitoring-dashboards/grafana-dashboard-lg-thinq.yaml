      "version": 6,
      "refresh": "1m",
      "time": {
        "from": "now-7d/d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "lg_postgres",
            "label": "Fonte LG",
            "type": "datasource",
            "query": "postgres",
            "regex": "/^Postgresql-LG-ThinQ$/",
            "hide": 2,
            "refresh": 1,
            "multi": false,
            "includeAll": false,
            "options": []
          },
          {
            "name": "device",
            "label": "Aparelho",
            "type": "query",
            "datasource": {
              "type": "postgres",
              "uid": "${lg_postgres}"
            },
            "definition": "SELECT device FROM public.lg_thinq_daily_energy UNION SELECT device FROM public.lg_thinq_monthly_energy ORDER BY 1",
            "query": "SELECT device FROM public.lg_thinq_daily_energy UNION SELECT device FROM public.lg_thinq_monthly_energy ORDER BY 1",
