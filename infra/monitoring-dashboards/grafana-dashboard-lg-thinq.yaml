            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 9,
          "title": "Ligado / desligado",
          "type": "state-timeline",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 24,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_power_on{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": false,
              "range": true,
              "editorMode": "code",
              "legendFormat": "Aparelho",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Desligado",
                      "index": 0
                    },
                    "1": {
                      "text": "Ligado",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "auto"
          },
          "description": "Estado de alimentação. A faixa mostra lacunas quando a coleta perde atualidade."
        },
        {
          "id": 10,
          "type": "row",
          "title": "Consumo de energia",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 11,
          "title": "Total no período",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "SELECT SUM(energy_wh) / 1000.0 AS \"Valor\" FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring} AND day BETWEEN ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND ($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND day < (now() AT TIME ZONE 'America/Sao_Paulo')::date",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "kwatth"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 12,
          "title": "Média por dia com leitura",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 24,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "SELECT AVG(energy_wh) / 1000.0 AS \"Valor\" FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring} AND day BETWEEN ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND ($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND day < (now() AT TIME ZONE 'America/Sao_Paulo')::date",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "kwatth"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 13,
          "title": "Dias com leitura",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "SELECT NULLIF(COUNT(*), 0) AS \"Valor\" FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring} AND day BETWEEN ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND ($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND day < (now() AT TIME ZONE 'America/Sao_Paulo')::date",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 14,
          "title": "Última data disponível",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 24,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "SELECT MAX(day)::text AS \"Valor\" FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring}",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 15,
          "title": "Consumo diário por data da LG",
          "type": "barchart",
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "WITH readings AS (SELECT day, energy_wh FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring} AND day BETWEEN ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND ($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND day < (now() AT TIME ZONE 'America/Sao_Paulo')::date),\n    bounds AS (\n        SELECT ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AS first_day,\n               LEAST(($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date,\n                     (now() AT TIME ZONE 'America/Sao_Paulo')::date - 1) AS last_day\n    ), days AS (\n        SELECT first_day + n AS day FROM bounds\n        CROSS JOIN LATERAL generate_series(0, last_day - first_day) AS offsets(n)\n    )\n    SELECT to_char(days.day, 'DD/MM/YYYY') AS \"Dia\", energy_wh / 1000.0 AS \"Consumo\"\n    FROM days LEFT JOIN readings USING (day) ORDER BY days.day",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "kwatth"
            },
            "overrides": []
          },
          "options": {
            "xField": "Dia",
            "orientation": "vertical",
            "tooltip": {
              "mode": "single"
            },
            "legend": {
              "showLegend": false
            }
          },
          "description": "Cada barra usa a data original da leitura. Dias ausentes aparecem como lacunas."
        },
        {
          "id": 16,
          "title": "Consumo mensal no período selecionado",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "WITH bounds AS (\n  SELECT ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AS first_day,\n         LEAST(($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date,\n               (now() AT TIME ZONE 'America/Sao_Paulo')::date - 1) AS last_day\n), daily AS (\n  SELECT date_trunc('month', day::timestamp)::date AS month,\n         SUM(energy_wh) AS energy_wh, COUNT(*) AS days\n  FROM public.lg_thinq_daily_energy CROSS JOIN bounds\n  WHERE device = ${device:sqlstring} AND day BETWEEN first_day AND last_day\n  GROUP BY 1\n), imported AS (\n  SELECT month, energy_wh\n  FROM public.lg_thinq_monthly_energy CROSS JOIN bounds\n  WHERE device = ${device:sqlstring} AND month >= first_day\n    AND (month + interval '1 month')::date - 1 <= last_day\n), combined AS (\n  SELECT COALESCE(d.month, i.month) AS month, d.days,\n         CASE WHEN i.month IS NOT NULL AND COALESCE(d.days, 0) <\n              ((i.month + interval '1 month')::date - i.month)\n              THEN i.energy_wh ELSE d.energy_wh END AS energy_wh,\n         CASE WHEN i.month IS NOT NULL AND COALESCE(d.days, 0) <\n              ((i.month + interval '1 month')::date - i.month)\n              THEN 'Total mensal do app' ELSE 'Soma diária' END AS source\n  FROM daily d FULL OUTER JOIN imported i USING (month)\n)\nSELECT to_char(month, 'YYYY-MM') AS \"Mês\", energy_wh / 1000.0 AS \"Consumo\",\n       COALESCE(days, 0) AS \"Dias com leitura\", source AS \"Fonte\"\nFROM combined ORDER BY month DESC",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Consumo"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "kwatth"
                  }
                ]
              }
            ]
          },
          "options": {},
          "description": "Para meses inteiros, usa a soma diária quando a cobertura é completa e o total do app quando a cobertura é incompleta. Meses parciais mostram apenas os dias com leitura."
        },
        {
          "id": 17,
          "type": "row",
          "title": "Filtro e coleta",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 42,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 18,
          "title": "Uso do filtro · valor bruto",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 43,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_filter_used_time_raw{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
