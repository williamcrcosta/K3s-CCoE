        {
          "id": 15,
          "title": "Consumo diário por data da LG",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "WITH readings AS (SELECT day, energy_wh FROM public.lg_thinq_daily_energy WHERE device = ${device:sqlstring} AND day BETWEEN ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND ($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AND day < (now() AT TIME ZONE 'America/Sao_Paulo')::date),\n    bounds AS (\n        SELECT ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AS first_day,\n               LEAST(($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date,\n                     (now() AT TIME ZONE 'America/Sao_Paulo')::date - 1) AS last_day\n    ), days AS (\n        SELECT first_day + n AS day FROM bounds\n        CROSS JOIN LATERAL generate_series(0, last_day - first_day) AS offsets(n)\n    )\n    SELECT days.day::timestamp AT TIME ZONE 'America/Sao_Paulo' AS \"time\", energy_wh / 1000.0 AS \"Consumo\"\n    FROM days LEFT JOIN readings USING (day) ORDER BY days.day",
              "rawQuery": true,
              "format": "time_series",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "kwatth",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 0,
                "fillOpacity": 85,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "light-blue"
              },
              "min": 0,
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "description": "Cada barra usa a data original da leitura. Dias ausentes aparecem como lacunas."
        },
        {
          "id": 16,
          "title": "Consumo mensal no período selecionado",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 41,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "postgres",
            "uid": "${lg_postgres}"
          },
          "targets": [
            {
              "datasource": {
                "type": "postgres",
                "uid": "${lg_postgres}"
              },
              "rawSql": "WITH bounds AS (\n  SELECT ($__timeFrom()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date AS first_day,\n         LEAST(($__timeTo()::timestamptz AT TIME ZONE 'America/Sao_Paulo')::date,\n               (now() AT TIME ZONE 'America/Sao_Paulo')::date - 1) AS last_day\n), daily AS (\n  SELECT date_trunc('month', day::timestamp)::date AS month,\n         SUM(energy_wh) AS energy_wh, COUNT(*) AS days\n  FROM public.lg_thinq_daily_energy CROSS JOIN bounds\n  WHERE device = ${device:sqlstring} AND day BETWEEN first_day AND last_day\n  GROUP BY 1\n), imported AS (\n  SELECT month, energy_wh\n  FROM public.lg_thinq_monthly_energy CROSS JOIN bounds\n  WHERE device = ${device:sqlstring} AND month >= first_day\n    AND (month + interval '1 month')::date - 1 <= last_day\n), combined AS (\n  SELECT COALESCE(d.month, i.month) AS month, d.days,\n         CASE WHEN i.month IS NOT NULL AND COALESCE(d.days, 0) <\n              ((i.month + interval '1 month')::date - i.month)\n              THEN i.energy_wh ELSE d.energy_wh END AS energy_wh,\n         CASE WHEN i.month IS NOT NULL AND COALESCE(d.days, 0) <\n              ((i.month + interval '1 month')::date - i.month)\n              THEN 'Total mensal do app' ELSE 'Soma diária' END AS source\n  FROM daily d FULL OUTER JOIN imported i USING (month)\n)\nSELECT to_char(month, 'YYYY-MM') AS \"Mês\", energy_wh / 1000.0 AS \"Consumo\",\n       COALESCE(days, 0) AS \"Dias com leitura\", source AS \"Fonte\"\nFROM combined ORDER BY month DESC",
              "rawQuery": true,
              "format": "table",
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Consumo"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "kwatth"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "options": {},
          "description": "Para meses inteiros, usa a soma diária quando a cobertura é completa e o total do app quando a cobertura é incompleta. Meses parciais mostram apenas os dias com leitura."
        },
