apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lg-thinq
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  lg-thinq.json: |-
    {
      "id": null,
      "uid": "lg-thinq-climatizacao",
      "title": "LG ThinQ · Cockpit de Climatização",
      "description": "Estado e temperaturas via Prometheus. Consumo por data da LG via PostgreSQL. Consulte o contrato de coleta no repositório.",
      "timezone": "America/Sao_Paulo",
      "tags": [
        "homelab",
        "lg-thinq",
        "climatizacao",
        "energia"
      ],
      "schemaVersion": 42,
      "version": 3,
      "refresh": "1m",
      "time": {
        "from": "now-7d/d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "lg_postgres",
            "label": "Fonte LG",
            "type": "datasource",
            "query": "postgres",
            "regex": "/^LG ThinQ PostgreSQL$/",
            "hide": 2,
            "refresh": 1,
            "multi": false,
            "includeAll": false,
            "options": []
          },
          {
            "name": "device",
            "label": "Aparelho",
            "type": "query",
            "datasource": {
              "type": "postgres",
              "uid": "${lg_postgres}"
            },
            "definition": "SELECT device FROM public.lg_thinq_daily_energy UNION SELECT device FROM public.lg_thinq_monthly_energy ORDER BY 1",
            "query": "SELECT device FROM public.lg_thinq_daily_energy UNION SELECT device FROM public.lg_thinq_monthly_energy ORDER BY 1",
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Climatização — Agora",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Estado do aparelho",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_power_on{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Desligado",
                      "index": 0
                    },
                    "1": {
                      "text": "Ligado",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Temperatura ambiente",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_room_temperature_celsius{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "celsius"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Temperatura programada",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_target_temperature_celsius{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "celsius"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Última coleta há",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"}",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Modo, ventilação, aletas, visor e temporizadores",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_device_state_info{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": true,
              "range": false,
              "editorMode": "code",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados"
            },
            "overrides": []
          },
          "options": {},
          "description": "Valores reportados pela LG. O modo configurado pode continuar selecionado com o aparelho desligado.",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "device": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "endpoint": true,
                  "container": true
                },
                "renameByName": {
                  "mode": "Modo",
                  "fan": "Ventilação",
                  "fan_detail": "Detalhe",
                  "swing": "Oscilação vertical",
                  "display": "Visor",
                  "run_state": "Estado interno",
                  "start_timer": "Início programado",
                  "stop_timer": "Parada programada",
                  "sleep_timer": "Timer de sono"
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Temperatura e funcionamento",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 8,
          "title": "Temperatura ambiente × programada",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_room_temperature_celsius{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": false,
              "range": true,
              "editorMode": "code",
              "legendFormat": "Ambiente",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "lg_thinq_target_temperature_celsius{device=\"$device\"} and on(device) (time() - lg_thinq_state_last_success_timestamp_seconds{device=\"$device\"} < 300)",
              "instant": false,
              "range": true,
              "editorMode": "code",
              "legendFormat": "Programada",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados",
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              }
