grafana:
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: longhorn
  plugins:
  - alexanderzobnin-zabbix-app
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
    - grafana.wcrpc.lan
    tls:
    - hosts:
      - grafana.wcrpc.lan
      secretName: wcrpc-tls
prometheus:
  prometheusSpec:
    retention: 3d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
      - prometheus.wcrpc.lan
      tls:
      - hosts:
        - prometheus.wcrpc.lan
        secretName: wcrpc-tls
