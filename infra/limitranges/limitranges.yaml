# Default resource requests/limits for containers that don't specify them.
# Applies only to pods created after the LimitRange — existing pods pick them
# up on their next restart/reschedule.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resources
  namespace: longhorn-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
---
