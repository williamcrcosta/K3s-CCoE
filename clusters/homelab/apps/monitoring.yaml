apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: platform-argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.4.1
    helm:
      values: |
        crds:
          upgradeJob:
            enabled: true
        grafana:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          env:
            GF_DATABASE_TYPE: postgres
            GF_DATABASE_HOST: 192.168.50.30:5432
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: grafana
            GF_DATABASE_SSL_MODE: disable
          envFromSecrets:
            - name: grafana-db-credentials
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          deploymentStrategy:
            type: Recreate
          persistence:
            enabled: false
          plugins:
          - alexanderzobnin-zabbix-app
          - marcusolsson-dynamictext-panel
          - grafana-postgresql-datasource
          additionalDataSources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki-gateway.monitoring.svc:80
            isDefault: false
            jsonData:
              maxLines: 1000
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
            - grafana.wccosta.com.br
            tls:
            - hosts:
              - grafana.wccosta.com.br
              secretName: wccosta-tls
        additionalPrometheusRulesMap:
          windows-desktop-alerts:
            groups:
            - name: windows-desktop
              rules:
              - alert: WindowsDesktopOffline
                expr: up{job="windows-desktop"} == 0
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "Desktop X870AORUSELITE offline"
                  description: "windows_exporter em 192.168.50.9:9182 sem resposta ha mais de 1h (desktop desligado/suspenso ou exporter parado)."
              - alert: WindowsDesktopDiskSpaceHigh
                expr: 100 * (windows_logical_disk_size_bytes{job="windows-desktop",volume!~"Harddisk.*"} - windows_logical_disk_free_bytes{job="windows-desktop",volume!~"Harddisk.*"}) / windows_logical_disk_size_bytes{job="windows-desktop",volume!~"Harddisk.*"} > 85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Desktop: volume {{ $labels.volume }} acima de 85%"
                  description: "O volume {{ $labels.volume }} do desktop esta com {{ $value }}% de uso ha 15min."
              - alert: WindowsDesktopDiskSpaceCritical
                expr: 100 * (windows_logical_disk_size_bytes{job="windows-desktop",volume!~"Harddisk.*"} - windows_logical_disk_free_bytes{job="windows-desktop",volume!~"Harddisk.*"}) / windows_logical_disk_size_bytes{job="windows-desktop",volume!~"Harddisk.*"} > 95
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Desktop: volume {{ $labels.volume }} acima de 95%"
                  description: "O volume {{ $labels.volume }} do desktop esta com {{ $value }}% de uso ha 15min."
              - alert: WindowsDesktopCommitChargeHigh
                expr: 100 * windows_memory_committed_bytes{job="windows-desktop"} / windows_memory_commit_limit{job="windows-desktop"} > 90
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Desktop: commit charge acima de 90%"
                  description: "Memoria comprometida (RAM+pagefile) do desktop em {{ $value }}% do limite ha 15min."
              - alert: WindowsDesktopCpuHigh
                expr: 100 - avg(irate(windows_cpu_time_total{job="windows-desktop",mode="idle"}[15m])) * 100 > 90
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Desktop: CPU acima de 90% por 30min"
                  description: "CPU do desktop sustentada acima de 90% ha 30min."
        prometheus:
          prometheusSpec:
            retention: 30d
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                cpu: "2"
                memory: 3Gi
            additionalScrapeConfigs:
              - job_name: proxmox-pve
                static_configs:
                  - targets:
                      - 192.168.50.250:9221
                metrics_path: /metrics
              - job_name: node-192.168.50.250
                static_configs:
                  - targets:
                      - 192.168.50.250:9100
                metrics_path: /metrics
              - job_name: node-rke2-pgdb
                static_configs:
                  - targets:
                      - 192.168.50.30:9100
                metrics_path: /metrics
              - job_name: postgres-rke2-pgdb
                static_configs:
                  - targets:
                      - 192.168.50.30:9187
                metrics_path: /metrics
              - job_name: windows-vm
                static_configs:
                  - targets:
                      - 10.100.20.10:9182
                metrics_path: /metrics
              - job_name: windows-desktop
                static_configs:
                  - targets:
                      - 192.168.50.9:9182
                metrics_path: /metrics
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
                  storageClassName: longhorn
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
            - prometheus.wccosta.com.br
            tls:
            - hosts:
              - prometheus.wccosta.com.br
              secretName: wccosta-tls
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
              telegram_api_url: https://api.telegram.org
            route:
              receiver: 'null'
              group_by:
              - namespace
              - alertname
              continue: false
              routes:
              - receiver: telegram
                matchers:
                - severity=~"critical|warning"
                continue: false
              - receiver: "null"
                matchers:
                - alertname="Watchdog"
                continue: false
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
            receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id: 561566814
                message: |
                  {{ range .Alerts }}
                  *Alert:* {{ .Labels.alertname }}
                  *Summary:* {{ .Annotations.summary }}
                  *Severity:* {{ .Labels.severity }}
                  *Namespace:* {{ .Labels.namespace }}
                  *Description:* {{ .Annotations.description }}
                  {{ end }}
            inhibit_rules:
            - source_matchers:
              - severity="critical"
              target_matchers:
              - severity=~"warning|info"
              equal:
              - namespace
              - alertname
            - source_matchers:
              - severity="warning"
              target_matchers:
              - severity="info"
              equal:
              - namespace
              - alertname
            - source_matchers:
              - alertname="InfoInhibitor"
              target_matchers:
              - severity="info"
              equal:
              - namespace
            - target_matchers:
              - alertname="InfoInhibitor"
          alertmanagerSpec:
            secrets:
            - alertmanager-telegram
        defaultRules:
          disabled:
            KubeCPUOvercommit: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
